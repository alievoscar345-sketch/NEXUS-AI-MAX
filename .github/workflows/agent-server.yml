name: NEXUS Agent Server CI

on:
  push:
    branches: [nexus-1.0-development]
    paths:
      - 'agent_server/**'
      - '.github/workflows/agent-server.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent_server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q app
      - name: Run safety tests
        env:
          PYTHONPATH: .
          NEXUS_AGENT_DB: /tmp/nexus-agent-test.db
          NEXUS_AGENT_WORKSPACE: /tmp/nexus-agent-workspace
        run: python -m unittest discover -s tests -v
