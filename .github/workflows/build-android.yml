name: Build NEXUS AI APK

on:
  workflow_dispatch:
  push:
    branches: [nexus-1.0-development]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXUS_KEYSTORE_BASE64: ${{ secrets.NEXUS_KEYSTORE_BASE64 }}
      NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
      NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
      NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v4.0.2

      - name: Install Android packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build signed release APK or debug fallback
        shell: bash
        run: |
          if [[ -n "$NEXUS_KEYSTORE_BASE64" && -n "$NEXUS_KEYSTORE_PASSWORD" && -n "$NEXUS_KEY_ALIAS" && -n "$NEXUS_KEY_PASSWORD" ]]; then
            echo "$NEXUS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexus-release.jks"
            NEXUS_KEYSTORE_PATH="$RUNNER_TEMP/nexus-release.jks" \
            NEXUS_KEYSTORE_PASSWORD="$NEXUS_KEYSTORE_PASSWORD" \
            NEXUS_KEY_ALIAS="$NEXUS_KEY_ALIAS" \
            NEXUS_KEY_PASSWORD="$NEXUS_KEY_PASSWORD" \
              gradle --no-daemon :app:assembleRelease
            echo "APK_VARIANT=release" >> "$GITHUB_ENV"
          else
            echo "::warning::Release signing secrets are not configured. Building a debug APK; it may not update an APK signed with another key."
            gradle --no-daemon :app:assembleDebug
            echo "APK_VARIANT=debug" >> "$GITHUB_ENV"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-AI-MAX-${{ env.APK_VARIANT }}-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
