name: Build NEXUS AI APK

on:
  workflow_dispatch:
  push:
    branches: [nexus-1.0-development]
    tags: ['v*']
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXUS_KEYSTORE_BASE64: ${{ secrets.NEXUS_KEYSTORE_BASE64 }}
      NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
      NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
      NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v4.0.2

      - name: Install Android packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Run Android unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK for safe migration
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-AI-MAX-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build signed release APK
        shell: bash
        run: |
          if [[ -n "$NEXUS_KEYSTORE_BASE64" && -n "$NEXUS_KEYSTORE_PASSWORD" && -n "$NEXUS_KEY_ALIAS" && -n "$NEXUS_KEY_PASSWORD" ]]; then
            echo "$NEXUS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexus-release.jks"
            NEXUS_KEYSTORE_PATH="$RUNNER_TEMP/nexus-release.jks" \
            NEXUS_KEYSTORE_PASSWORD="$NEXUS_KEYSTORE_PASSWORD" \
            NEXUS_KEY_ALIAS="$NEXUS_KEY_ALIAS" \
            NEXUS_KEY_PASSWORD="$NEXUS_KEY_PASSWORD" \
              gradle --no-daemon :app:assembleRelease
            echo "APK_VARIANT=release" >> "$GITHUB_ENV"
          else
            echo "::warning::Release signing secrets are not configured. Release APK was not built."
            echo "APK_VARIANT=debug" >> "$GITHUB_ENV"
          fi

      - name: Verify release APK signature
        if: env.APK_VARIANT == 'release'
        shell: bash
        run: |
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          if [[ -z "$APK_PATH" ]]; then
            echo "::error::Release APK was not produced."
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK_PATH"

      - name: Upload release APK
        if: env.APK_VARIANT == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-AI-MAX-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Require permanent release signing for tagged releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [[ "$APK_VARIANT" != "release" ]]; then
            echo "::error::Tagged releases require all four NEXUS signing secrets. Refusing to publish a debug APK."
            exit 1
          fi

      - name: Generate SHA-256 checksum
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd app/build/outputs/apk/release
          sha256sum *.apk > SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt

# Trigger a fresh signing verification after configuring repository secrets.
