
name: Build NEXUS AI APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'NEXUS_AI_MAX_0.2.0_source.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.2

      - name: Install Android packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract project
        run: unzip -q NEXUS_AI_MAX_0.2.0_source.zip

      - name: Build APK
        working-directory: NEXUS_MAX
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-AI-MAX-debug-apk
          path: NEXUS_MAX/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
