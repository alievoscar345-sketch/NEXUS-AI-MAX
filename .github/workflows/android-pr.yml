name: Android PR Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'agent_server/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-pr.yml'

# Avoid spending CI minutes on obsolete commits when a newer PR revision exists.
concurrency:
  group: nexus-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend syntax and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent_server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall -q app tests

      - name: Run backend tests
        env:
          PYTHONPATH: .
          NEXUS_AGENT_DB: /tmp/nexus-agent-test.db
          NEXUS_AGENT_WORKSPACE: /tmp/nexus-agent-workspace
        run: python -m unittest discover -s tests -v

  android-build:
    name: Android unit tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v4.0.2

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Run Android unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Assemble debug APK
        if: ${{ !cancelled() }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        if: ${{ !cancelled() && hashFiles('app/build/outputs/apk/debug/app-debug.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
