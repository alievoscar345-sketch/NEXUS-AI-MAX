services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXUS_AGENT_DB: /data/nexus-agent.db
      NEXUS_AGENT_WORKSPACE: /data/workspace
      NEXUS_AGENT_WORKER_ENABLED: "false"
    ports:
      - "${NEXUS_AGENT_PORT:-8080}:8080"
    volumes:
      - nexus_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXUS_AGENT_DB: /data/nexus-agent.db
      NEXUS_AGENT_WORKSPACE: /data/workspace
      NEXUS_AGENT_WORKER_ENABLED: "false"
    volumes:
      - nexus_data:/data
    depends_on:
      api:
        condition: service_healthy

volumes:
  nexus_data:
